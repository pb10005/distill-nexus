# FEAT-005 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 実装指示書 §4 知識ベース・AI入力性の要件, §5.6, §5.7, §6.3, §6.4, §7 export
id: FEAT-005
title: "Distill Nexus 知識系フェーズ（distill / synthesize / export）"
status: draft

intent: "抽出テキストから根拠付きの用語・エンティティ・事実を取り出して統合し、LLMのコンテキストやRAGにそのまま投入できる `_knowledge/` を毎回一貫した形で再生成する。"

out_of_scope:
  - "ベクトル埋め込みの計算・ベクトルDBへの投入（chunks.jsonl の出力までを担う）"
  - "_knowledge/ の差分マージ（毎回再生成する。`<!-- manual -->` セクションの保持のみ行う）"
  - "知識グラフの可視化・GUI表示"
  - "外部知識（Web検索・既存辞書）による用語定義の補完"

assumptions:
  - id: AS-016
    statement: "トークン数はすべて文字数からの近似（英語 ÷2.5、日本語 ÷1.5、lang=ja のとき日本語係数）で数え、トークナイザは使わない。chunks.jsonl の tokens もこの近似値"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-017
    statement: "正規化の候補ペアは difflib.SequenceMatcher の類似度 0.8 以上、または空白区切りトークンを1つ以上共有する名前の組とし、LLM が same=true と判定したものを canonical 名へ統合する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-018
    statement: "`<!-- manual -->` セクションは、`<!-- manual -->` から `<!-- /manual -->` までのブロックとし、再生成時は同じ slug の topics/<slug>.md の末尾に元のまま付け戻す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-019
    statement: "facts・terms の source は `整理後パス`（apply 済みなら manifest の to、未 apply なら元の相対パス）に `#<locator>` を付けた文字列とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

