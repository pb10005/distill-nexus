# FEAT-002 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 実装指示書 §3, §5.1, §5.2, §8
id: FEAT-002
title: "Distill Nexus scan / extract フェーズ"
status: frozen

intent: "対象ディレクトリの雑多なファイルを安全に列挙・ハッシュ化し、形式ごとの抽出器で正規化Markdownへ変換して、後続の分類と知識抽出が同じテ\
  キストを共有できるようにする。"

out_of_scope:
  - "動画・音声・実行バイナリからのテキスト抽出（scan で列挙し misc 扱いにするのみ）"
  - "`.doc` `.xls` `.ppt` 旧バイナリOffice形式と `.odt` 系の抽出"
  - "パスワード保護されたPDF・Officeファイルの復号"
  - "tree-sitter による構文解析。コードは正規表現で関数・クラス名を拾う範囲に留める"
  - "ファイル内容のウイルス・マルウェア検査"

assumptions:
  - id: AS-005
    statement: "`.dnignore` の解釈には `pathspec` ライブラリ（純Python）を使う。§2 の依存表に無いが §5.1
      で名指しされているため追加する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-006
    statement: "HTML の本文抽出には `beautifulsoup4` を使い、trafilatura
      は採用しない（依存を軽く保つ）。script/style/nav/footer 要素を除去し、見出しは Markdown 見出しへ変換する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-007
    statement: "言語判定（lang）は抽出テキスト中のひらがな・カタカナ・漢字の比率が 20% 以上なら ja、それ未満で英字があれば
      en、判定不能なら und とする。外部の言語判定ライブラリは使わない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-008
    statement: "puremagic が拡張子と異なる種別を返した場合、magic 側がテキスト系以外（画像・PDF・Office zip）のときのみ
      magic を優先する。テキスト系拡張子で magic 判定が取れない場合は拡張子に従う（プレーンテキストは magic を持たないため）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

  - id: AS-025
    statement: "`--no-images` は画像ファイルに加え、スキャンPDFの低文字数頁の画像化OCRも止める。その頁は空テキストとし
      quality: text のまま記録する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

