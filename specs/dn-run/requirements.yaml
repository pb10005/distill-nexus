    then: "plan.json と _knowledge/ を生成し、元ファイルを1件も移動しない"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-24
    note: pytest tests/test_run.py 20 passed. plan.json存在(:35),
      _knowledge/INDEX.md存在(:36), 元ファイルのパス・hash・mtime不変(:37)
    evidence: tests/test_run.py:35

  - id: AC-071
    kind: functional
    given: "サンプルツリーのコピー"
    when: "`dn run --apply --yes` の後に `dn undo` を実行する"
    then: "全ファイルの相対パス・ハッシュ・mtime が元ツリーと一致する"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-24
    note: run --apply --yes 後に移動発生(:47-48)、undo後に
      tree_state(相対パス・sha256・mtime_ns)が元と完全一致(:51)
    evidence: tests/test_run.py:51

  - id: AC-072
    kind: functional
    given: "`dn run` を1回完了したサンプルツリー"
    when: "もう一度 `dn run` を実行する"
    then: "LLM の実呼び出し0件で終了し、`no changes` を出力する"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-24
    note: 2回目 run で llm.generated==0 かつ api_calls==0(:61)、message=='no changes' かつ
      stderr に no changes(:62-63)。generated は全バックエンドのキャッシュミス数(src/dn/llm.py:157)
    evidence: tests/test_run.py:61

  - id: AC-073
    kind: functional
    given: "`--concurrency 1` で、モック LLM が3回目の分類呼び出しで KeyboardInterrupt を送出して中断した run"
    when: "`dn run` を再実行する"
    then: "中断前に完了した2件の LLM 呼び出しは再実行しない。残りのファイルのラベルを labels.jsonl
      に保存する（末尾に途中まで書かれた行があっても読み飛ばす）"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-24
    note: concurrency=1で3回目classifyにKeyboardInterrupt、完了2件を確認(:91)、末尾に途中行を追記(:89)。再実行でclassify
      3回のみ・完了2件のパスは再送なし(:99-102)、labels.jsonlから5件読める(:105)
    evidence: tests/test_run.py:99

