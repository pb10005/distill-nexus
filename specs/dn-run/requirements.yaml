# FEAT-006 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 実装指示書 §2 Claude Code 連携, §7 CLI, §9 冪等性・エラー処理, §10 統合テスト・CI・受け入れ基準
id: FEAT-006
title: "Distill Nexus 一括実行・状態表示・Claude Code 連携・受け入れ基準"
status: draft

intent: "全フェーズを1コマンドで冪等に実行でき、人間と Claude Code エージェントの両方が同じ CLI の機械可読出力を読んで plan → 承認 → apply を安全に進められるようにする。"

out_of_scope:
  - "分類ロジックを Claude Code 側（スキル・プロンプト）に持たせること。スキルは CLI を呼ぶ手順のみを書く"
  - "PyPI への公開作業・リリース自動化"
  - "常駐監視（ディレクトリ変更を検知して自動実行する daemon / watch モード）"
  - "SIGINT 以外のシグナル（SIGKILL 中の書き込み途中ファイル）からの自動修復。manifest の追記単位での整合のみ保証する"

assumptions:
  - id: AS-020
    statement: "実 API キーと実 CI 実行を必要とする受け入れ基準（3OS の CI 緑、実応答を録画したサンプルでの分類精度、INDEX.md の QA 正答数、推定コストと実測の差、Claude Code 実機での plan→承認→apply）は verify: manual とし、本実装セッションでは証跡を作れないため人間に返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-021
    statement: "`tests/fixtures/sample_tree/` は `scripts/make_sample_tree.py` で生成してコミットする。Windows 予約名・260文字超のパスを持つファイルは Windows の checkout を壊すためコミットせず、テスト実行時に一時ディレクトリへ生成する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-022
    statement: "run の「変更なし」判定は、scan の新規・変更ファイル数0、LLM 実呼び出し0、apply 移動0 のときに `no changes` を出力することとする。_knowledge/ は毎回再生成するが、生成内容が同一なら変更に数えない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

acceptance:
  - id: AC-070
    kind: functional
    given: "taxonomy.yaml を持つサンプルツリー"
    when: "`--apply` を付けずに `dn run --dry-llm` を実行する"
    then: "plan.json と _knowledge/ を生成し、元ファイルを1件も移動しない"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-071
    kind: functional
    given: "サンプルツリーのコピー"
    when: "`dn run --apply --yes` の後に `dn undo` を実行する"
    then: "全ファイルの相対パス・ハッシュ・mtime が元ツリーと一致する"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-072
    kind: functional
    given: "`dn run` を1回完了したサンプルツリー"
    when: "もう一度 `dn run` を実行する"
    then: "LLM の実呼び出し0件で終了し、`no changes` を出力する"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-073
    kind: functional
    given: "classify の途中（3件目の処理中）で KeyboardInterrupt により中断した run"
    when: "`dn run` を再実行する"
    then: "中断前に完了したファイルの LLM 呼び出しは再実行しない。残りのファイルのラベルを labels.jsonl に保存する"
    priority: must
    verify: test
    status: pending
    attempts: 0

  - id: AC-074
