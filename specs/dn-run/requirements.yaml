# FEAT-006 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 実装指示書 §7 CLI, §9 冪等性・エラー処理, §10 統合テスト
id: FEAT-006
title: "Distill Nexus 一括実行・状態表示・export"
status: frozen

intent: "全フェーズを1コマンドで冪等に実行でき、中断や部分失敗からも再開でき、人間とエージェントの両方が同じ CLI の機械可読出力を読めるようにする。"

out_of_scope:
  - "PyPI への公開作業・リリース自動化"
  - "常駐監視（ディレクトリ変更を検知して自動実行する daemon / watch モード）"
  - "SIGINT 以外のシグナル（SIGKILL 中の書き込み途中ファイル）からの自動修復。manifest の追記単位での整合のみ保証する"

assumptions:
  - id: AS-021
    statement: "`tests/fixtures/sample_tree/` は `scripts/make_sample_tree.py`
      で生成してコミットする。Windows 予約名・260文字超のパスを持つファイルは Windows の checkout
      を壊すためコミットせず、テスト実行時に一時ディレクトリへ生成する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-022
    statement: "run の「変更なし」判定は、scan の新規・変更ファイル数0、LLM 実呼び出し0、apply 移動0 のときに `no
      changes` を出力することとする。_knowledge/ は毎回再生成するが、生成内容が同一なら変更に数えない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-034
    statement: "Ctrl-C（KeyboardInterrupt）で中断した場合の終了コードは 130（シェル慣例）とし、AS-024 の 0〜4
      の体系の外に置く"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-037
    statement: "指示書 §7 の共通オプションのうち AC
      を持たないもの（--lang、--include-hidden、--follow-symlinks、--full-hash、-v/-vv、--no\
      -color、export の --output）は指示書どおりに実装する。--lang は LLM への出力言語指示と _knowledge/
      の見出し語（日本語/英語）を切り替える。auto はソースの文字数で多い言語"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

acceptance:
