# FEAT-003 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 実装指示書 §2, §6 共通ルール, §9 冪等性・エラー処理・コスト制御・プライバシー, §10
id: FEAT-003
title: "Distill Nexus LLM 呼び出し層（構造化出力・リトライ・キャッシュ・コスト制御）"
status: frozen

intent: "全フェーズのLLM呼び出しを1か所に集約し、スキーマ強制・再試行・キャッシュ・コスト上限・APIを使わないテスト経路を保証することで、再実行してもコストが増えず、結果が再現できるようにする。"

out_of_scope:
  - "Anthropic 以外のLLMプロバイダ（OpenAI, Bedrock, Vertex）への対応"
  - "Message Batches API による非同期バッチ投入"
  - "ストリーミング応答の逐次表示"
  - "LLM応答の録画ファイルを自動生成するレコーダーCLI（録画は実キーを持つ人間が DN_LLM_RECORD=1 で行う）"

assumptions:
  - id: AS-009
    statement: "並列呼び出しは anthropic SDK の AsyncAnthropic（httpx ベース）と asyncio.Semaphore で行う。SDK 内蔵のリトライは max_retries=0 で無効化し、dn 側で 429/529/5xx/接続エラーのみ最大5回、基底1秒の指数バックオフで再試行する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-010
    statement: "録画再生モード（DN_LLM_REPLAY=1）の録画キーはLLMキャッシュキーと同じ値とし、`tests/fixtures/llm/<key>.json` に応答JSONを置く。DN_LLM_RECORD=1 のときは実呼び出し結果を同じ場所へ保存する。録画の置き場所は環境変数 DN_LLM_FIXTURES で変更できる（既定 tests/fixtures/llm/）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-011
    statement: "単価（USD / 100万トークン）は sonnet 入力3・出力15、opus 入力15・出力75、haiku 入力1・出力5 を既定表として持つ。出力トークンの事前見積りはフェーズごとの max_tokens の 30% とする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

  - id: AS-023
    statement: "temperature=0 と強制 tool_choice（type: tool）は、それを受け付けるモデル（claude-*-4-6 以前の4系、haiku-4-5）にのみ送る。temperature を拒否するモデル（opus-4-7 以降、sonnet-5 以降、opus-5 系、fable 系、mythos 系）では temperature を省略し、強制 tool_choice を拒否するモデル（opus-5-5、fable-5-1、mythos-5-1）では tool_choice auto とツール使用を指示する system 文で代替する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-031
    statement: "--dry-llm の分類ダミーは taxonomy の slug・name・subcategories とのキーワード一致で category を選ぶ（一致なしは misc / confidence 0.3）。知識抽出ダミーは見出しを用語・エンティティにする。スキーマ準拠だけでなく配線確認時に整理結果が偏らないようにするための決定的なダミーであり、実分類の代替ではない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

