    given: "LLM が1回目にスキーマ違反（confidence: 2）の tool_use 入力を返し、2回目に正しい入力を返す"
    when: "構造化出力付きで LLM を呼び出す"
    then: "2回目の呼び出しに1回目の検証エラー内容を含め、2回目の検証済み結果を返す"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-24
    note: 2回目リクエスト本文に検証エラー(failed validation/confidence)を含むこと、呼び出し2回、2回目の結果(0.8)を返すことを検証。pytest 16 passed
