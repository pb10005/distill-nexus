# FEAT-007 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 実装指示書 §4 manifest, §5.5, §8 ファイルロック・別ドライブ移動, §9 破壊的操作・ロールバック
# FEAT-004 から spec-challenger の指摘（上書き経路・undo 不能な操作・lock の寿命）を受けて分割した。
id: FEAT-007
title: "Distill Nexus 実行・巻き戻しフェーズ（apply / undo）"
status: frozen

intent: "plan.json の移動を、既存ファイルを1つも上書き・消失させずに実行し、manifest から run 単位で元へ戻せるようにする。"

out_of_scope:
  - "元ファイルの内容の書き換え・完全削除（重複は _duplicates/ かOSのゴミ箱へ送るのみ）"
  - "OS のゴミ箱からの自動復元（send2trash は復元 API を持たない）"
  - "複数 run を横断した undo の選択的マージ（undo は run 単位）"
  - "ネットワークドライブ・クラウド同期フォルダ固有のロック制御"

assumptions:
  - id: AS-015
    statement: "undo は manifest の to→from を逆順に戻した後、apply
      で作成されて空になったディレクトリ（出力先配下）を削除する。manifest.json 自体は `undone_at` を付けて残す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-028
    statement: "manifest.json は指示書 §4 の単一 run 形式を run の配列へ拡張し、`{version: 1, root,
      runs: [{run_id, out_root, moves: [...], undone_at}]}` とする。from は root
      からの相対 POSIX パスを元のコードポイント列のまま記録する。to は出力先が root 配下なら root からの相対 POSIX
      パス、root の外なら絶対 POSIX パスとする"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-029
    statement: "`.dn/lock` には保持プロセスの PID を書く。PID のプロセスが存在しない lock は stale
      として警告を出して取り直す。apply と undo の両方が lock を取り、正常終了・例外・KeyboardInterrupt のいずれでも
      finally で削除する"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-030
    statement: "apply 中のファイル単位の失敗（PermissionError、OSError）は errors.jsonl
      に記録して残りを続行し、終了コード3とする。事前検証の失敗だけが全件中止（終了コード1）になる"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-035
    statement: "apply の事前検証には指示書 §5.5 の空き容量チェック（コピー・別デバイス移動の合計サイズと移動先の空き容量）を含める。別デバイス間の移動は copy2 → サイズと全量ハッシュの一致確認 → 元の削除の順で行う"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

