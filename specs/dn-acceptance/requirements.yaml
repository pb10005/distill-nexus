    note: "manual。ANTHROPIC_API_KEY 未設定で録画不可。tests/fixtures/llm/ も正解ラベル付きサンプルも存在しない。人間の作業: 実キーで DN_LLM_RECORD=1 により sample_tree(約40件)の分類応答を録画し、正解ラベル表を用意、DN_LLM_REPLAY=1 で再生して一致率90%以上を示す出力を evidence に記録する"

