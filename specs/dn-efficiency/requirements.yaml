# FEAT-009 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 2026-09-24 の人間の指示「スキャン・抽出に時間とトークンを使いすぎている」への対策案のうち
#       (2) 分類のバッチ化とルールによる事前振り分け、(5) 画像 vision の既定オフ を採用。
id: FEAT-009
title: "Distill Nexus 呼び出し削減（ルール振り分け・分類バッチ化・vision 既定オフ）"
status: frozen

intent: "同じ整理結果を保ったまま LLM 呼び出し回数と送信トークンを減らし、整理を速く安くする。"

out_of_scope:
  - "Message Batches API による非同期投入（FEAT-003 の out_of_scope のまま）"
  - "distill / synthesize の呼び出し削減（今回は classify と extract のみ）"
  - "本文を送らずファイル名だけから LLM でカテゴリを推定するモード"
  - "ルールの自動学習（過去の分類結果からルールを生成する機能）"

assumptions:
  - id: AS-038
    statement: "バッチには内容ハッシュが異なるファイルをパス順に詰め、1バッチの上限は classify_batch_size 件（既定10、1〜50）かつ本文合計 classify_batch_chars 文字（既定24,000）とする。各ファイルの本文は先頭 6,000 文字まで（vision 無効の画像のように本文が空のファイルはメタデータだけを送る）。1件だけのバッチは従来の単体分類プロンプトで送る。labels.jsonl への保存は検証に通ったバッチごとにまとめて行い、再開時は labels.jsonl に記録済みかどうかで未処理を判定する（バッチの詰め方が変わっても完了分は再送しない）。バッチ呼び出しの並列数は --concurrency に従う"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-039
    statement: "バッチ分類の max_tokens は 500 × 件数 + 500（上限 8,000）とする。応答の検証（全 file_id がちょうど1回ずつ現れ、各ラベルがスキーマと category の enum を満たすこと）に失敗したらバッチ全体を検証エラー付きで1回だけ再生成し、それでも失敗したバッチは各ファイルを単体分類でやり直す（単体分類の失敗は AC-029 と同じく errors.jsonl に記録）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-040
    statement: "ルールは .dn/config.yaml の rules に {glob, category} の並びで書き、対象ディレクトリからの相対 POSIX パスに gitignore 構文で照合して最初に一致したものを使う。既定ルールは `*.log` → misc の1件で、ユーザーが rules を書いても置き換わらず常にユーザーのルールの後ろに適用される。category は taxonomy の slug か misc（予約語だが有効）。taxonomy が無いときは misc 以外のルールを警告して無視する。ラベルは内容ハッシュ単位なので、同じハッシュのファイルのどれか1件がルールに一致すればハッシュ全体にそのルールを適用する（複数ルールに一致したらパス順で最初のファイルの最初のルール）。ルールは毎回 LLM 呼び出しの前に評価し、保存済みラベルより優先する。ルールで決まったラベルは confidence 1.0、title はファイル名、category が misc なら has_domain_knowledge は false"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-041
    statement: "vision（画像ファイルの文字起こしとスキャン PDF 頁の OCR）は既定で無効とし、config の images: true または CLI の --images で有効にする。--no-images は既定と同じ動作として残す。無効時は画像の本文を空（quality: none）、PDF の低文字数頁は pymupdf が抽出できたテキストのままとする（AS-025 もこの内容に改訂）"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

