    given: "taxonomy に contracts / specs を持ち、LLM が confidence 0.9 で contracts、0.6 で
      specs、0.4 で specs を返す3ファイル（閾値 0.6）"
    when: "classify を実行する"
    then: "confidence 0.9 と 0.6（閾値ちょうど）のファイルは LLM の返したカテゴリ、0.4 のファイルは misc として
      `labels.jsonl` に記録する"
    priority: must
    verify: test
    status: pass
    attempts: 0
    verified_at: 2026-09-24
    note: labels.jsonl 上で 0.9→contracts、0.6(閾値ちょうど)→specs、0.4→misc を検証。pytest 13
      passed
