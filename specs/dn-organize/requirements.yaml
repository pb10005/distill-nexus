# FEAT-004 — 要件の単一の正。実装・テスト・レビューはこれに従属する。
# 出典: 実装指示書 §4 整理後ディレクトリ, §5.3, §5.4, §6.1, §6.2
id: FEAT-004
title: "Distill Nexus 分類・計画フェーズ（classify / propose-taxonomy / plan）"
status: frozen

intent: "抽出済みテキストを LLM で分類し、元ファイルに一切触れないドライランの移動計画（plan.json）を作って、人間やエージェントが実行前に確認できるようにする。"

out_of_scope:
  - "元ファイルの内容の書き換え・完全削除（重複は _duplicates/ かOSのゴミ箱へ送るのみ）"
  - "分類結果を学習してプロンプトを自動改善する機能"
  - "ネットワークドライブ・クラウド同期フォルダ固有のロック制御"

assumptions:
  - id: AS-012
    statement: "`--propose-taxonomy` は既存の `taxonomy.yaml` を上書きせず、`.dn/taxonomy.proposed.yaml` に書き出す。ユーザーが内容を確認して `taxonomy.yaml` へ移す。taxonomy.yaml が無い状態で plan を実行した場合は提案を生成して停止し、終了コード0を返す"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-013
    statement: "年フォルダは classify の date（文書内の日付）から取った年を使い、date が null ならファイル mtime は使わず年フォルダを作らない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-014
    statement: "`--interactive` の確認は低信頼度（confidence < 閾値）のファイルに対してのみ行い、Enter で misc 維持、カテゴリ slug 入力でそのカテゴリへ変更する。`--json` と同時指定された場合は確認を行わない"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-026
    statement: "subcategory は taxonomy の該当カテゴリの subcategories に含まれる slug のときだけ採用し、それ以外（taxonomy に無い値、`..` やパス区切りを含む値）は捨てて subcategory なしとして扱う"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"
  - id: AS-027
    statement: "`--rename` の slug はタイトルを NFKC 正規化して英数字以外をハイフンにし小文字化したものとする。日本語は英小文字ケバブにできないため、Unicode の文字（\\w）はそのまま残す。結果が空なら元ファイル名の stem を同様に slug 化し、それも空なら `file` を使う"
    status: assumed
    owner: pb10005
    resolve_by: "2026-10-08"

open_questions: []

acceptance:
  - id: AC-040
    kind: functional
    given: "taxonomy に contracts / specs を持ち、LLM が confidence 0.9 で contracts、0.6 で specs、0.4 で specs を返す3ファイル（閾値 0.6）"
    when: "classify を実行する"
    then: "confidence 0.9 と 0.6（閾値ちょうど）のファイルは LLM の返したカテゴリ、0.4 のファイルは misc として `labels.jsonl` に記録する"
    priority: must
    verify: test
    status: pending
    attempts: 0


  - id: AC-041
    kind: functional
    given: "taxonomy のカテゴリ slug 一覧"
    when: "分類用の tool スキーマを組み立てる"
    then: "category の enum が taxonomy の slug 全件と misc だけに一致する"
    priority: must
    verify: test
    status: pending
    attempts: 0


  - id: AC-042
