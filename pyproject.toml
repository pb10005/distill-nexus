# @covers AC-001
[project]
name = "distill-nexus"
version = "0.1.0"
description = "Distill Nexus (dn): organize messy files by content and distill their domain knowledge into an AI-readable knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.6",
  "anthropic>=0.40",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "beautifulsoup4>=4.12",
  "charset-normalizer>=3.3",
  "puremagic>=1.20",
  "send2trash>=1.8",
  "pathspec>=0.12",   # .dnignore (gitignore syntax), AS-005
  "PyYAML>=6.0",      # config.yaml / taxonomy.yaml
]

[project.scripts]
dn = "dn.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-mock>=3.12",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["dn"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/dn"]

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "docx", "docx.*", "openpyxl", "openpyxl.*", "pptx", "pptx.*", "puremagic", "send2trash", "bs4", "charset_normalizer"]
ignore_missing_imports = true
