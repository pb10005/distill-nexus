# @covers AC-081
# 3 OS x Python 3.11 / 3.12: lint, format, strict types, tests with >= 80% coverage (§10 CI).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest --cov
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
      - name: dn --version
        run: uv run dn --version
